<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
        }
        .table-custom th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
            padding: 12px 16px;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.875rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        .custom-btn-primary { background: var(--accent-gold); color: #fff; border: none; font-weight: 500; }
        .custom-btn-primary:hover { background: #b0895c; color: #fff; }
        
        @media (max-width: 575.98px) {
            .dash-container { padding: 16px; }
            .card-custom { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Planner Dashboard</h4>
    <button class="btn custom-btn-primary rounded-pill px-4"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Create Invoice</button>
</div>
<div class="row g-4 mb-4">
    <div class="col-12 col-md-3">
        <div class="card-custom h-100">
            <div class="text-muted small fw-semibold mb-2 text-uppercase">Active Projects</div>
            <h3 class="fw-bold mb-0">12</h3>
        </div>
    </div>
    <div class="col-12 col-md-3">
        <div class="card-custom h-100">
            <div class="text-muted small fw-semibold mb-2 text-uppercase">Monthly Revenue</div>
            <h3 class="fw-bold mb-0">$18,450</h3>
        </div>
    </div>
    <div class="col-12 col-md-3">
        <div class="card-custom h-100">
            <div class="text-muted small fw-semibold mb-2 text-uppercase">Pending Tasks</div>
            <h3 class="fw-bold mb-0">24</h3>
        </div>
    </div>
    <div class="col-12 col-md-3">
        <div class="card-custom h-100">
            <div class="text-muted small fw-semibold mb-2 text-uppercase">New Inquiries</div>
            <h3 class="fw-bold mb-0 text-gold">5</h3>
        </div>
    </div>
</div>
<div class="row g-4">
    <div class="col-12 col-xl-8">
        <div class="card-custom h-100">
            <h6 class="fw-bold mb-4">Revenue Analytics (2026)</h6>
            <div id="chart-revenue"></div>
        </div>
    </div>
    <div class="col-12 col-xl-4">
        <div class="card-custom h-100">
            <h6 class="fw-bold mb-4">Upcoming Deadlines</h6>
            <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-3">
                <div>
                    <div class="fw-semibold" style="font-size:0.85rem;">Client Meeting - Smith Wedding</div>
                    <div class="text-muted" style="font-size:0.75rem;">Today, 2:00 PM</div>
                </div>
                <span class="badge-status badge-purple">Urgent</span>
            </div>
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <div class="fw-semibold" style="font-size:0.85rem;">Venue Deposit - Gala</div>
                    <div class="text-muted" style="font-size:0.75rem;">Tomorrow, 10:00 AM</div>
                </div>
                <span class="badge-status badge-pending">Pending</span>
            </div>
        </div>
    </div>
</div>

    </div>
    
<script>
    var options = {
        series: [{ name: 'Revenue', data: [12000, 15000, 11000, 18450, 16000, 22000] }],
        chart: { type: 'area', height: 300, toolbar: { show: false }, fontFamily: 'Inter' },
        colors: ['#c59b6d'],
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0, stops: [0, 90, 100] } },
        dataLabels: { enabled: false },
        stroke: { curve: 'smooth', width: 2 },
        xaxis: { categories: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'] }
    };
    new ApexCharts(document.querySelector('#chart-revenue'), options).render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
            --text-muted: #64748b;
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
            height: 100%;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
            flex-shrink: 0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        
        .btn-gold { 
            background: var(--accent-gold); 
            color: #fff; 
            border: none; 
            font-weight: 600; 
            transition: 0.3s;
        }
        .btn-gold:hover { background: #b0895c; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(197, 155, 109, 0.3); }
        .btn-outline-navy {
            border: 1px solid var(--primary-navy);
            color: var(--primary-navy);
            background: transparent;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-outline-navy:hover {
            background: var(--primary-navy);
            color: #fff;
        }

        .table-custom { white-space: nowrap; }
        .table-custom th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 2px solid #f1f5f9;
            padding: 16px;
            font-family: 'Inter', sans-serif;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.875rem;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Timeline */
        .timeline {
            border-left: 2px solid #e2e8f0;
            margin-left: 16px;
            padding-left: 24px;
            position: relative;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 24px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -33px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-gold);
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px rgba(197,155,109,0.2);
        }
        .timeline-item h6 { font-size: 0.95rem; font-family: 'Inter', sans-serif; font-weight: 600; margin-bottom: 4px; }
        .timeline-item p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0; line-height: 1.4; }
        .timeline-item .time { font-size: 0.7rem; color: #94a3b8; font-weight: 600; }

        @media (max-width: 575.98px) {
            .dash-container { padding: 16px 12px; }
            .card-custom { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<h4 class="fw-bold mb-4 font-serif">Account Settings</h4>

<div class="row g-4">
    <!-- Sidebar Navigation for Settings -->
    <div class="col-12 col-lg-3">
        <div class="card-custom p-0 overflow-hidden">
            <div class="list-group list-group-flush border-0">
                <a href="#" class="list-group-item list-group-item-action p-3 border-0 active" style="background-color: rgba(197, 155, 109, 0.1); color: var(--accent-gold); font-weight: 600;">
                    <i class="fa-regular fa-user me-2"></i> Personal Profile
                </a>
                <a href="#" class="list-group-item list-group-item-action p-3 border-0 text-muted fw-semibold">
                    <i class="fa-solid fa-shield-halved me-2"></i> Security & Password
                </a>
                <a href="#" class="list-group-item list-group-item-action p-3 border-0 text-muted fw-semibold">
                    <i class="fa-regular fa-bell me-2"></i> Notifications
                </a>
                <a href="#" class="list-group-item list-group-item-action p-3 border-0 text-muted fw-semibold">
                    <i class="fa-regular fa-credit-card me-2"></i> Billing Methods
                </a>
            </div>
        </div>
    </div>

    <!-- Settings Form Area -->
    <div class="col-12 col-lg-9">
        <div class="card-custom">
            <h5 class="fw-bold font-serif mb-4 pb-3 border-bottom">Personal Profile</h5>
            
            <!-- Avatar Upload -->
            <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom">
                <div class="position-relative">
                    <div style="width:100px; height:100px; border-radius:50%; background:var(--primary-navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:bold;">S</div>
                    <button class="btn btn-gold btn-sm rounded-circle position-absolute bottom-0 end-0 shadow" style="width:32px; height:32px; padding:0;"><i class="fa-solid fa-camera"></i></button>
                </div>
                <div>
                    <h6 class="fw-bold mb-1">Profile Photo</h6>
                    <p class="text-muted small mb-2">Upload a new avatar. Max file size 2MB.</p>
                    <button class="btn btn-outline-navy btn-sm rounded-pill px-3">Remove Photo</button>
                </div>
            </div>

            <!-- Form Fields -->
            <form>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">First Name</label>
                        <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="Sarah">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">Last Name</label>
                        <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="Johnson">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">Email Address</label>
                        <input type="email" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="sarah.johnson@example.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted">Phone Number</label>
                        <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="+1 (555) 123-4567">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold text-muted">Home Address</label>
                        <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="123 Eventura Avenue, New York, NY 10001">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                    <button type="button" class="btn btn-light rounded-pill px-4">Cancel</button>
                    <button type="button" class="btn btn-gold rounded-pill px-5">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

    </div>
    
    

    <!-- 404 Redirection Script for ALL interactables -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('a, button');
            interactables.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
</body>
</html>

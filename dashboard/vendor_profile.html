<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
            --text-muted: #64748b;
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
            height: 100%;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
            flex-shrink: 0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        
        .btn-gold { background: var(--accent-gold); color: #fff; border: none; font-weight: 600; transition: 0.3s; }
        .btn-gold:hover { background: #b0895c; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(197, 155, 109, 0.3); }
        .btn-outline-navy { border: 1px solid var(--primary-navy); color: var(--primary-navy); background: transparent; font-weight: 600; transition: 0.3s; }
        .btn-outline-navy:hover { background: var(--primary-navy); color: #fff; }

        .table-custom { white-space: nowrap; }
        .table-custom th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 2px solid #f1f5f9; padding: 16px; }
        .table-custom td { padding: 16px; vertical-align: middle; color: #334155; font-size: 0.875rem; border-bottom: 1px solid #f1f5f9; }

        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .avatar-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        
        /* Calendar UI */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-header { text-align: center; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); padding: 8px 0; text-transform: uppercase; }
        .cal-day { aspect-ratio: 1; border-radius: 8px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid #e2e8f0; }
        .cal-day:hover { background: #e2e8f0; }
        .cal-day.booked { background: var(--accent-gold); color: #fff; border-color: var(--accent-gold); }
        .cal-day.booked::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }
        .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }

        @media (max-width: 575.98px) {
            .dash-container { padding: 16px 12px; }
            .card-custom { padding: 16px; }
            .cal-day { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<h4 class="fw-bold mb-4 font-serif">Business Profile</h4>

<div class="card-custom p-0 overflow-hidden mb-4">
    <!-- Hero Cover -->
    <div style="height: 200px; background: url('../assets/images/img_76.webp') center/cover; position: relative;">
        <button class="btn btn-light btn-sm position-absolute rounded-pill shadow-sm" style="top: 16px; right: 16px;"><i class="fa-solid fa-camera me-2"></i>Change Cover</button>
    </div>
    
    <div class="px-4 pb-4 position-relative">
        <!-- Logo Avatar -->
        <div class="position-absolute" style="top: -50px; left: 24px;">
            <img src="../assets/images/img_50.webp" class="border border-4 border-white shadow-sm" style="width:100px; height:100px; border-radius:50%; object-fit:cover;" alt="Logo">
            <button class="btn btn-gold btn-sm rounded-circle position-absolute bottom-0 end-0 shadow" style="width:32px; height:32px; padding:0;"><i class="fa-solid fa-pen"></i></button>
        </div>
        
        <div class="mt-5 pt-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h4 class="fw-bold font-serif mb-1">Lumina Photography</h4>
                <p class="text-muted mb-2">Premium Event Photography & Videography</p>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-dark text-white rounded-pill px-3">Active Listing</span>
                    <span class="text-warning small"><i class="fa-solid fa-star"></i> 4.8 (124 Reviews)</span>
                </div>
            </div>
            <button class="btn btn-outline-navy rounded-pill px-4">View Public Profile</button>
        </div>
    </div>
</div>

<div class="card-custom">
    <h5 class="fw-bold font-serif mb-4 pb-3 border-bottom">Business Information</h5>
    <form>
        <div class="row g-4">
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Business Name</label>
                <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="Lumina Photography">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Category</label>
                <select class="form-select px-3 py-2 shadow-none border-secondary-subtle">
                    <option selected>Photography & Videography</option>
                    <option>Catering & Food</option>
                    <option>Venues</option>
                    <option>Entertainment</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Contact Email</label>
                <input type="email" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="contact@luminaphoto.com">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-muted">Business Phone</label>
                <input type="text" class="form-control px-3 py-2 shadow-none border-secondary-subtle" value="+1 (555) 987-6543">
            </div>
            <div class="col-12">
                <label class="form-label small fw-semibold text-muted">Bio / Description</label>
                <textarea class="form-control px-3 py-2 shadow-none border-secondary-subtle" rows="4">Capturing timeless moments for high-end corporate events, galas, and luxury weddings. We bring top-tier equipment including drones and cinematic cameras to ensure your event is immortalized perfectly.</textarea>
            </div>
        </div>

        <h5 class="fw-bold font-serif mb-3 mt-5 pb-3 border-bottom">Portfolio Highlights</h5>
        <div class="row g-3 mb-4">
            <div class="col-4 col-md-2">
                <img src="../assets/images/img_82.webp" class="w-100 rounded-3 shadow-sm" style="aspect-ratio:1; object-fit:cover;" alt="Portfolio">
            </div>
            <div class="col-4 col-md-2">
                <img src="../assets/images/img_84.webp" class="w-100 rounded-3 shadow-sm" style="aspect-ratio:1; object-fit:cover;" alt="Portfolio">
            </div>
            <div class="col-4 col-md-2">
                <img src="../assets/images/img_86.webp" class="w-100 rounded-3 shadow-sm" style="aspect-ratio:1; object-fit:cover;" alt="Portfolio">
            </div>
            <div class="col-4 col-md-2">
                <div class="w-100 rounded-3 d-flex flex-column align-items-center justify-content-center border border-2 border-dashed" style="aspect-ratio:1; cursor:pointer; color:var(--accent-gold); border-color:var(--accent-gold) !important; background:rgba(197,155,109,0.05);">
                    <i class="fa-solid fa-plus fs-4 mb-1"></i>
                    <span class="small fw-bold">Upload</span>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-5 pt-3 border-top">
            <button type="button" class="btn btn-gold rounded-pill px-5">Save Profile Updates</button>
        </div>
    </form>
</div>

    </div>
    
    

    <!-- 404 Redirection Script for ALL interactables -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('a, button');
            interactables.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
</body>
</html>

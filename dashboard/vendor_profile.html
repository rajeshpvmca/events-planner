<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
        }
        .table-custom th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
            padding: 12px 16px;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.875rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        .btn-gold { background: var(--accent-gold); color: #fff; border: none; font-weight: 500; }
        .btn-gold:hover { background: #b0895c; color: #fff; }
        
        @media (max-width: 575.98px) {
            .dash-container { padding: 16px; }
            .card-custom { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<h4 class="fw-bold mb-4">Business Profile</h4>
<div class="card-custom">
    <div class="d-flex align-items-center gap-4 mb-5 pb-4 border-bottom">
        <div class="stat-icon bg-gold text-white flex-shrink-0" style="width: 100px; height: 100px; font-size: 2.5rem;"><i class="fa-solid fa-camera"></i></div>
        <div>
            <h4 class="fw-bold mb-1">Lumina Photography</h4>
            <p class="text-muted mb-2">Premium Event Photography in New York</p>
            <span class="badge bg-dark text-white rounded-pill px-3">Active Profile</span>
        </div>
        <button class="btn btn-outline-dark rounded-pill ms-auto">Upload Logo</button>
    </div>
    
    <div class="row g-4">
        <div class="col-md-6">
            <label class="form-label small fw-semibold text-muted">Business Name</label>
            <input type="text" class="form-control" value="Lumina Photography">
        </div>
        <div class="col-md-6">
            <label class="form-label small fw-semibold text-muted">Category</label>
            <select class="form-select"><option selected>Photography & Videography</option><option>Catering</option></select>
        </div>
        <div class="col-12">
            <label class="form-label small fw-semibold text-muted">Bio / Description</label>
            <textarea class="form-control" rows="4">Capturing timeless moments for high-end corporate events, galas, and weddings.</textarea>
        </div>
        <div class="col-12 mt-4">
            <button type="button" class="btn btn-gold rounded-pill px-4">Update Profile</button>
        </div>
    </div>
</div>

    </div>
    
</body>
</html>

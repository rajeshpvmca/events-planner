<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
        }
        .table-custom th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid #f1f5f9;
            padding: 12px 16px;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.875rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        .custom-btn-primary { background: var(--accent-gold); color: #fff; border: none; font-weight: 500; }
        .custom-btn-primary:hover { background: #b0895c; color: #fff; }
        
        @media (max-width: 575.98px) {
            .dash-container { padding: 16px; }
            .card-custom { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">My Services</h4>
    <button class="btn custom-btn-primary rounded-pill px-4"><i class="fa-solid fa-plus me-2"></i>Add Service</button>
</div>
<div class="row g-4">
    <div class="col-12 col-md-6">
        <div class="card-custom d-flex flex-row align-items-center gap-4">
            <div class="stat-icon bg-gold text-white flex-shrink-0" style="width: 80px; height: 80px;"><i class="fa-solid fa-camera-retro"></i></div>
            <div class="flex-grow-1">
                <h5 class="fw-bold mb-1">Premium Wedding Package</h5>
                <div class="text-muted small mb-2">Full day coverage, 2 photographers, drone footage.</div>
                <div class="fw-bold text-dark">$3,500</div>
            </div>
            <button class="btn btn-sm btn-light rounded-circle"><i class="fa-solid fa-pen"></i></button>
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div class="card-custom d-flex flex-row align-items-center gap-4">
            <div class="stat-icon flex-shrink-0" style="width: 80px; height: 80px;"><i class="fa-solid fa-camera"></i></div>
            <div class="flex-grow-1">
                <h5 class="fw-bold mb-1">Standard Event Coverage</h5>
                <div class="text-muted small mb-2">4 hours coverage, digital gallery.</div>
                <div class="fw-bold text-dark">$1,200</div>
            </div>
            <button class="btn btn-sm btn-light rounded-circle"><i class="fa-solid fa-pen"></i></button>
        </div>
    </div>
</div>

    </div>
    
</body>
</html>

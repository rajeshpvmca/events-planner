<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
            --text-muted: #64748b;
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
            height: 100%;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
            flex-shrink: 0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        
        .btn-gold { background: var(--accent-gold); color: #fff; border: none; font-weight: 600; transition: 0.3s; }
        .btn-gold:hover { background: #b0895c; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(197, 155, 109, 0.3); }
        .btn-outline-navy { border: 1px solid var(--primary-navy); color: var(--primary-navy); background: transparent; font-weight: 600; transition: 0.3s; }
        .btn-outline-navy:hover { background: var(--primary-navy); color: #fff; }

        .table-custom { white-space: nowrap; }
        .table-custom th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 2px solid #f1f5f9; padding: 16px; }
        .table-custom td { padding: 16px; vertical-align: middle; color: #334155; font-size: 0.875rem; border-bottom: 1px solid #f1f5f9; }

        /* Scroller for kanban boards or tight areas */
        .scroller-x { overflow-x: auto; padding-bottom: 10px; }
        .scroller-x::-webkit-scrollbar { height: 6px; }
        .scroller-x::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        /* Message UI */
        .chat-sidebar { border-right: 1px solid #e2e8f0; max-height: 600px; overflow-y: auto; }
        .chat-main { max-height: 600px; display: flex; flex-direction: column; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.9rem; }
        .msg-sent { background: var(--accent-gold); color: white; border-bottom-right-radius: 4px; margin-left: auto; }
        .msg-recv { background: #f1f5f9; color: var(--primary-navy); border-bottom-left-radius: 4px; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .avatar-lg { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }

        @media (max-width: 767.98px) {
            .chat-sidebar { border-right: none; border-bottom: 1px solid #e2e8f0; max-height: 250px; }
            .dash-container { padding: 16px 12px; }
            .card-custom { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
    <h4 class="fw-bold mb-0 font-serif">Project Management</h4>
    <div class="input-group" style="max-width: 300px;">
        <span class="input-group-text bg-white border-end-0 text-muted rounded-start-pill ps-3"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" class="form-control border-start-0 rounded-end-pill shadow-none" placeholder="Search projects...">
    </div>
</div>

<div class="row g-4">
    <!-- Planning Column -->
    <div class="col-12 col-md-6 col-xl-4">
        <div class="card-custom p-3 bg-light border" style="box-shadow:none;">
            <h6 class="fw-bold font-serif mb-3 d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-clipboard-list text-gold me-2"></i> Planning Phase</span>
                <span class="badge bg-secondary rounded-pill">2</span>
            </h6>
            
            <div class="card border-0 shadow-sm mb-3 rounded-4 overflow-hidden">
                <img src="../assets/images/img_45.webp" class="w-100" style="height:120px; object-fit:cover;" alt="Wedding">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0">Johnson Wedding</h6>
                        <span class="badge-status badge-pending">Deposit</span>
                    </div>
                    <p class="text-muted small mb-3"><i class="fa-regular fa-calendar me-1"></i> Dec 12, 2026</p>
                    <div class="d-flex align-items-center justify-content-between border-top pt-2 mt-2">
                        <img src="../assets/images/img_42.webp" class="avatar shadow-sm" style="width:30px; height:30px;" alt="Client">
                        <button class="btn btn-sm btn-outline-navy rounded-pill px-3" style="font-size:0.75rem;">Manage</button>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0">Stark Corp Retreat</h6>
                        <span class="badge-status badge-purple">Concepts</span>
                    </div>
                    <p class="text-muted small mb-3"><i class="fa-regular fa-calendar me-1"></i> Jan 05, 2027</p>
                    <div class="progress mb-2" style="height: 6px;"><div class="progress-bar bg-gold" style="width: 25%;"></div></div>
                    <div class="d-flex align-items-center justify-content-between pt-2">
                        <span class="small fw-bold">25% Done</span>
                        <button class="btn btn-sm btn-outline-navy rounded-pill px-3" style="font-size:0.75rem;">Manage</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Execution Column -->
    <div class="col-12 col-md-6 col-xl-4">
        <div class="card-custom p-3 bg-light border" style="box-shadow:none;">
            <h6 class="fw-bold font-serif mb-3 d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-spinner text-gold me-2"></i> In Progress</span>
                <span class="badge bg-secondary rounded-pill">1</span>
            </h6>
            
            <div class="card border-0 shadow-sm mb-3 rounded-4 overflow-hidden border-start border-4" style="border-color: var(--accent-gold) !important;">
                <img src="../assets/images/img_62.webp" class="w-100" style="height:120px; object-fit:cover;" alt="Gala">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0">Tech Innovators Gala</h6>
                        <span class="badge-status badge-success">On Track</span>
                    </div>
                    <p class="text-muted small mb-3"><i class="fa-regular fa-calendar me-1"></i> Nov 15, 2026</p>
                    <div class="progress mb-2" style="height: 6px;"><div class="progress-bar bg-gold" style="width: 80%;"></div></div>
                    <div class="d-flex align-items-center justify-content-between pt-2">
                        <div class="d-flex align-items-center gap-1">
                            <img src="../assets/images/img_50.webp" class="avatar shadow-sm" style="width:25px; height:25px;" alt="Vendor">
                            <img src="../assets/images/img_52.webp" class="avatar shadow-sm" style="width:25px; height:25px; margin-left:-10px;" alt="Vendor">
                            <span class="small text-muted ms-1">+2 Vendors</span>
                        </div>
                        <button class="btn btn-sm btn-gold rounded-pill px-3" style="font-size:0.75rem;">Manage</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Completed Column -->
    <div class="col-12 col-md-6 col-xl-4">
        <div class="card-custom p-3 bg-light border" style="box-shadow:none;">
            <h6 class="fw-bold font-serif mb-3 d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-check-circle text-success me-2"></i> Completed</span>
                <span class="badge bg-secondary rounded-pill">1</span>
            </h6>
            
            <div class="card border-0 shadow-sm mb-3 rounded-4 overflow-hidden opacity-75">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0 text-decoration-line-through text-muted">Smith 50th Anniv.</h6>
                        <span class="badge bg-secondary">Archived</span>
                    </div>
                    <p class="text-muted small mb-0"><i class="fa-regular fa-calendar me-1"></i> Sep 20, 2026</p>
                    <button class="btn btn-sm btn-light border rounded-pill px-3 mt-3 w-100" style="font-size:0.75rem;">View Summary</button>
                </div>
            </div>
        </div>
    </div>
</div>

    </div>
    
    

    <!-- 404 Redirection Script for ALL interactables -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('a, button');
            interactables.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --primary-navy: #0f1423;
            --accent-gold: #c59b6d;
            --bg-light: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.03);
            --text-muted: #64748b;
        }
        body, html {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            max-width: 100vw;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
        }
        .dash-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card-custom {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s;
            height: 100%;
        }
        .card-custom:hover {
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(197, 155, 109, 0.1);
            color: var(--accent-gold);
            flex-shrink: 0;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .badge-purple { background: #f3e8ff; color: #6b21a8; }
        
        .text-gold { color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); color: white; }
        
        .btn-gold { background: var(--accent-gold); color: #fff; border: none; font-weight: 600; transition: 0.3s; }
        .btn-gold:hover { background: #b0895c; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(197, 155, 109, 0.3); }
        .btn-outline-navy { border: 1px solid var(--primary-navy); color: var(--primary-navy); background: transparent; font-weight: 600; transition: 0.3s; }
        .btn-outline-navy:hover { background: var(--primary-navy); color: #fff; }

        .table-custom { white-space: nowrap; }
        .table-custom th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); border-bottom: 2px solid #f1f5f9; padding: 16px; }
        .table-custom td { padding: 16px; vertical-align: middle; color: #334155; font-size: 0.875rem; border-bottom: 1px solid #f1f5f9; }

        .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .avatar-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        
        /* Calendar UI */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-header { text-align: center; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); padding: 8px 0; text-transform: uppercase; }
        .cal-day { aspect-ratio: 1; border-radius: 8px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid #e2e8f0; }
        .cal-day:hover { background: #e2e8f0; }
        .cal-day.booked { background: var(--accent-gold); color: #fff; border-color: var(--accent-gold); }
        .cal-day.booked::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }
        .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }

        @media (max-width: 575.98px) {
            .dash-container { padding: 16px 12px; }
            .card-custom { padding: 16px; }
            .cal-day { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="dash-container">
        
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
    <div>
        <h4 class="fw-bold mb-1 font-serif">Vendor Hub</h4>
        <p class="text-muted small mb-0">Track your bookings, earnings, and profile performance.</p>
    </div>
    <button class="btn btn-gold rounded-pill px-4 py-2 w-100 w-sm-auto"><i class="fa-solid fa-calendar-check me-2"></i>Update Availability</button>
</div>

<!-- Stats Grid -->
<div class="row g-4 mb-4">
    <div class="col-6 col-lg-3">
        <div class="card-custom text-center p-3 p-md-4">
            <h2 class="fw-bold mb-1 font-serif text-gold">14</h2>
            <div class="text-muted small fw-bold text-uppercase" style="letter-spacing:0.5px;">New Inquiries</div>
        </div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="card-custom text-center p-3 p-md-4">
            <h2 class="fw-bold mb-1 font-serif">8</h2>
            <div class="text-muted small fw-bold text-uppercase" style="letter-spacing:0.5px;">Confirmed (Month)</div>
        </div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="card-custom text-center p-3 p-md-4" style="background:var(--primary-navy); color:#fff;">
            <h2 class="fw-bold mb-1 font-serif text-gold">$9.2k</h2>
            <div class="small fw-bold text-uppercase opacity-75" style="letter-spacing:0.5px;">Total Earnings</div>
        </div>
    </div>
    <div class="col-6 col-lg-3">
        <div class="card-custom text-center p-3 p-md-4">
            <h2 class="fw-bold mb-1 font-serif text-success">+34%</h2>
            <div class="text-muted small fw-bold text-uppercase" style="letter-spacing:0.5px;">Profile Views</div>
        </div>
    </div>
</div>

<div class="row g-4">
    <!-- Chart Section -->
    <div class="col-12 col-xl-8">
        <div class="card-custom h-100">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h5 class="fw-bold font-serif mb-0">Inquiries vs Bookings</h5>
                <button class="btn btn-sm btn-light border rounded-pill"><i class="fa-solid fa-download me-2"></i>Export</button>
            </div>
            <div id="chart-vendor" class="w-100" style="min-height: 320px;"></div>
        </div>
    </div>

    <!-- Incoming Requests Sidebar -->
    <div class="col-12 col-xl-4">
        <div class="card-custom h-100">
            <h5 class="fw-bold font-serif mb-4">Pending Requests</h5>
            <div class="d-flex flex-column gap-3">
                <!-- Request 1 -->
                <div class="p-3 border rounded-3 bg-light">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <img src="../assets/images/img_42.webp" class="avatar shadow-sm" style="width:30px; height:30px;" alt="Client">
                            <span class="fw-bold text-dark" style="font-size:0.85rem;">Sarah Johnson</span>
                        </div>
                        <span class="badge-status badge-pending">New</span>
                    </div>
                    <p class="small text-muted mb-3"><i class="fa-regular fa-calendar me-1"></i> Dec 12, 2026 • Wedding Photography</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-gold flex-grow-1 rounded-pill">Accept</button>
                        <button class="btn btn-sm btn-outline-navy flex-grow-1 rounded-pill">Decline</button>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="p-3 border rounded-3 bg-light">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <img src="../assets/images/img_48.webp" class="avatar shadow-sm" style="width:30px; height:30px;" alt="Client">
                            <span class="fw-bold text-dark" style="font-size:0.85rem;">Marcus Vance</span>
                        </div>
                        <span class="badge-status badge-pending">New</span>
                    </div>
                    <p class="small text-muted mb-3"><i class="fa-regular fa-calendar me-1"></i> Jan 05, 2027 • Corporate Video</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-gold flex-grow-1 rounded-pill">Accept</button>
                        <button class="btn btn-sm btn-outline-navy flex-grow-1 rounded-pill">Decline</button>
                    </div>
                </div>
                
                <button class="btn btn-light w-100 rounded-pill mt-2">View All Inquiries</button>
            </div>
        </div>
    </div>
</div>

    </div>
    
    
<script>
    var options = {
        series: [
            { name: 'Inquiries', data: [31, 40, 28, 51, 42, 60] },
            { name: 'Confirmed Bookings', data: [11, 32, 25, 32, 34, 45] }
        ],
        chart: { type: 'line', height: 320, toolbar: { show: false }, fontFamily: 'Inter' },
        colors: ['#0f1423', '#c59b6d'],
        stroke: { curve: 'smooth', width: 3 },
        xaxis: { categories: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'] },
        markers: { size: 5, hover: { sizeOffset: 2 } },
        legend: { position: 'top', horizontalAlign: 'right' }
    };
    new ApexCharts(document.querySelector("#chart-vendor"), options).render();
</script>


    <!-- 404 Redirection Script for ALL interactables -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('a, button');
            interactables.forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
</body>
</html>
